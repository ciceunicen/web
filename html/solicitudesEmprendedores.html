<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/rolManager.css">
    <link rel="stylesheet" href="../css/styleNav.css">

    <link rel="stylesheet" href="../css/notifications.css">
    <title>Solicitudes Emprendedores</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <div><img class="nav_img" src="../img/logo.png" alt="Logo CICE"></div>
            <div class="nav-item" id="navBack">
                <a class="nav-link active click_nav" href="#" id="btn-back">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>

                    Volver
                </a>
            </div>
            <div class="user-logout">
                <div class="nombre-avatar">
                    <img src="../img/avatarIcon.jpg" alt="Icono de Usuario">
                    <p id="name">Nombre de usuario</p>
                </div>
                <img class="icono-notificacion" src="../img/Icono-notificacion1.svg" alt="notificacion">
                <div class="notificaciones-container dashboard hidden">
                    <div class="notificaciones-top">
                        <p>Notificaciones</p>
                    </div>
                    <section class="notificaciones">

                    </section>
                    <div class="notificaciones-bottom">

                    </div>
                </div>
                <button class="closeSession" title="Cerrar sesión">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-box-arrow-right" viewBox="0 0 16 16">
                        <path fill-rule="evenodd"
                            d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z">
                        </path>
                        <path fill-rule="evenodd"
                            d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <article>
        <div class="listUsuarios">
            <p class="title_list"> SOLICITUDES EMPRENDEDORES</p>
        </div>
       
        <div class="contenedor_tabla_usuarios">
            <section class="list-users-manager">
                <table class="table table-hover">
                    <thead class="header-list-users-manager">
                        <tr>
                            <th scope="col" class="manager-table">CUIT-CUIL</th>
                            <th scope="col" class="manager-table">Email</th>
                            <th scope="col" class="manager-table">USUARIO</th>
                            <th scope="col" class="manager-table">Telefono</th>
                            <th scope="col" class="manager-table">accion</th>
                        </tr>
                    </thead>
                    <tbody class="userManagersTable" id="lista"></tbody>
                </table>
            </section>
        </div>
    </article>

</body>
<script src="../js/closeSession.js"></script>
<script src="../js/CargaSolicitudesNuevosEmprendedores.js"></script>
