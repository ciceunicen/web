<div class="datosEmprendedor"></div>
<div class="historyProject"></div>
<div class="projectTitle">
    <p>Proyecto</p>
</div>
<div class="projectLoading">
    <h5 class="title_project" id="titulo">Título: </h5>
    <div class="div_description_stage">
        <h6 class="h6_description_stage">Descripción del proyecto</h6>
        <p id="descripcion"></p>
    </div>
    <div class="div_description_stage">
        <h6 class="h6_description_stage">Estadio</h6>
        <p id="estadio"></p>
    </div>

    <div class="div_description_stage">
        <h6 class="h6_description_stage">Administrador del proyecto</h6>
        <h7 class="h7_admin_username">Nombre de usuario:</h7>
        <p id="adminUsername"></p>
        <h7 class="h7_admin_email">Email de contacto:</h7>
        <p id="adminEmail"></p>
    </div>
    <div class="div_description_stage hide" id="estadoDiv"></div>
    <div class="div_cont_needs_assitences">
        <h6>Necesidades</h6>
        <div id="necesidades" class="div_needs_assitences"></div>
    </div>
    <div class="separator_line"></div>
    <div class="div_cont_needs_assitences">
        <h6>Asistencias</h6>
        <div id="asistencia" class="div_needs_assitences"></div>
    </div>
    <div class="separator_line"></div>
    <!--CARGA DE VISTA PREVIA DE ADJUNTOS-->
    <div class="div_adjuntos" id="div_adjuntos"></div>
    <div class="contenedorBotones">
        <button class="btn btn-primary" id="editarProyecto">Editar</button>
        <button class="btn btn-primary" id="agregarDiagnostico">Agregar diagnóstico</button>
    </div>
    <div class="diagnostic-loading-form">
        <form id="diagnosticForm" class="diagnosticForm" action="#" method="POST">
            <button class="diagnosticForm__exitBtn"><img src="../img/cerrar.png" width="20px" height="20px" alt=""></button>
            <div class="input-section">
                <label class="input-label">Proyecto "<span id="nombreProyecto"></span>"</label>
                <p class="error" id="projectError"></p>
            </div>
            <div class="input-section">
                <label class="input-label" for="description" required>Diagnostico *</label>
                <textarea type="text" id="diagnostic" name="diagnostic" placeholder="diagnóstico"></textarea>
                <p class="error" id="diagnosticError"></p>
            </div>
            <div class="saveContainer">
                <input class="btn-project-blue" type="submit" value="Guardar">
                <div class="diagnostic-save"></div>
            </div>  
        </form>
    </div>
</div>
