<div class="projectHistory">
    <p>Historial administración</p>
    <a href="#" class="slideDownHistory"><img src="../img/expandir.png" class="slideDown"/></a>
</div>
<div class="hiddenData" id="projectDataHistory">
    <div class="div_table_admin_history">
        <table class="table">
            <thead>
            <tr>
                <th scope="col">Legajo</th>
                <th scope="col">Nombre</th>
                <th scope="col">Acción</th>
                <th scope="col">Fecha</th>
            </tr>
            </thead>
            <tbody class="projectHistoryTable">
            
            </tbody>
        </table>
        <!--  para agregar en una futura iteracion     -->
        <!--  <button class="btn btn-success btn_save_green">Ver mas</button>     -->
    </div>
</div>
<div id="modal" class="modal-container-diagnostic">
    <div class="modal-content-diagnostic">
        <div class="flex-modal-content">
            <h2>Diagnóstico</h2>
            <a id="closeModal" href="#"><img src="../img/cerrar.png" width="20px" height="20px" alt=""></a> 
        </div>
        <div class="modal-ver-diagnostico">
            <p id="diagnosticText"></p>
            <button class="btn btn-primary">Editar</button>
        </div>
        <form method="post" class="modal-editar-diagnostico hidden">
            <textarea name="nuevoDiagnostico" id="nuevoDiagnostico" placeholder="Ingrese el diagnostico"></textarea>
            <p class="error" id="diagnosticErrorInEditDiagnostic"></p>
            <div>
                <button class="btn btn-primary">Guardar</button>
                <button class="btn btn-secondary">Cancelar</button>
            </div>
            <div class="diagnostic-save"></div>
        </form>
    </div>
</div>
